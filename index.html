<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriveTrust — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --green-deep:#123A2B;
    --green-mid:#1F5B44;
    --green-soft:#E9F1EC;
    --mustard:#E3A63A;
    --orange:#D9701E;
    --cream:#FBF6EC;
    --ink:#1A1A17;
    --ink-soft:#5C5A52;
    --line:#E4DCC9;
    --radius:16px;
    --shadow:0 6px 20px rgba(18,58,43,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,.display{font-family:'Fraunces',serif;font-weight:700;letter-spacing:-0.01em;}
  a{color:inherit;}

  /* ---------- Login screen ---------- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  }
  .card{
    width:100%;max-width:380px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
  }
  .card-header{
    background:linear-gradient(135deg,var(--green-deep),var(--green-mid));
    color:#fff;padding:24px;
  }
  .logo-badge{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,var(--mustard),var(--orange));
    color:var(--green-deep);display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:15px;margin-bottom:12px;
  }
  .card-header h1{font-size:20px;margin:0 0 4px;color:#fff;}
  .card-header p{margin:0;font-size:13px;color:#CFE2D8;}
  .card-body{padding:24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;
    background:var(--green-soft);color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--green-mid);outline-offset:1px;}
  .btn{
    padding:12px 16px;border:none;border-radius:10px;font-weight:700;font-size:14px;
    cursor:pointer;transition:background .18s ease;
  }
  .btn-primary{background:var(--orange);color:#fff;width:100%;}
  .btn-primary:hover{background:#C2620E;}
  .btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
  .btn-secondary{background:var(--green-soft);color:var(--green-deep);}
  .btn-danger{background:#fde8e6;color:#B3261E;}
  .form-msg{margin-top:12px;font-size:13px;font-weight:600;text-align:center;}
  .form-msg.ok{color:var(--green-mid);}
  .form-msg.err{color:#B3261E;}
  .switch-link{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-soft);}
  .switch-link a{color:var(--orange);font-weight:700;text-decoration:none;}

  /* ---------- Dashboard ---------- */
  #dashboard{display:none;}
  header.topbar{
    position:sticky;top:0;z-index:20;background:var(--green-deep);color:#fff;
    padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 14px rgba(0,0,0,0.15);
  }
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .topbar-logo{
    position:relative;width:42px;height:42px;border-radius:50%;
    background:linear-gradient(135deg,var(--mustard),var(--orange));
    color:var(--green-deep);display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:15px;
    cursor:pointer;flex-shrink:0;overflow:hidden;
  }
  .topbar-logo img{width:100%;height:100%;object-fit:cover;object-position:center;}
  .topbar-logo-edit{
    position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;
    background:var(--green-deep);color:#fff;font-size:9px;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid #fff;
  }
  .topbar h1{font-size:17px;margin:0;color:#fff;}
  .topbar p{margin:0;font-size:11.5px;color:#CFE2D8;}
  #logoutBtn{
    background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.25);
    padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  #logoutBtn:hover{background:rgba(255,255,255,0.2);}

  main{max-width:820px;margin:0 auto;padding:20px 16px 60px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab-btn{
    border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:999px;
    font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .18s ease;
  }
  .tab-btn.active{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}

  .panel{display:none;}
  .panel.active{display:block;}

  .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .panel-header h2{font-size:17px;margin:0;}

  .add-form{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .add-form h3{font-size:14px;margin:0 0 12px;color:var(--green-mid);}
  .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media(max-width:520px){.row-3{grid-template-columns:1fr;}}

  .list-item{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;
    align-items:flex-start;gap:10px;box-shadow:var(--shadow);
  }
  .list-item .info h4{margin:0 0 3px;font-size:14.5px;}
  .list-item .info .meta{font-size:12px;color:var(--ink-soft);}
  .list-item .info .desc{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .list-item .actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    border:none;background:var(--green-soft);color:var(--green-deep);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;
  }
  .icon-btn.danger{background:#fde8e6;color:#B3261E;}
  .empty-state{
    text-align:center;padding:26px 14px;color:var(--ink-soft);font-size:13.5px;
    border:1px dashed var(--line);border-radius:var(--radius);background:#fff;
  }
  .badge{
    display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.05em;padding:2px 8px;border-radius:999px;background:var(--green-soft);
    color:var(--green-deep);margin-right:6px;
  }

  /* ---------- Car product-card grid ---------- */
  .item-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:480px){.item-grid{grid-template-columns:1fr 1fr;gap:10px;}}
  .item-pcard{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow);
  }
  .item-pimg-wrap{
    position:relative;width:100%;height:0;padding-top:75%;
    background:#F7F5EE;
  }
  .item-pimg{
    position:absolute;top:8px;left:8px;right:8px;bottom:8px;
    width:calc(100% - 16px);height:calc(100% - 16px);
    object-fit:contain;object-position:center;display:block;border-radius:8px;
  }
  .item-pimg-placeholder{
    position:absolute;top:10px;left:10px;right:10px;bottom:10px;
    display:flex;align-items:center;justify-content:center;
    color:var(--green-mid);font-family:'Fraunces',serif;font-weight:700;font-size:28px;
    opacity:0.5;
  }
  .item-pchip{
    position:absolute;left:8px;bottom:8px;background:#fff;border:1px solid var(--line);
    border-radius:7px;font-size:10px;font-weight:700;color:var(--ink-soft);padding:3px 6px;
  }
  .item-status-chip{
    position:absolute;left:8px;top:8px;border-radius:7px;font-size:9.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:0.04em;padding:3px 7px;color:#fff;
  }
  .item-status-chip.available{background:var(--green-mid);}
  .item-status-chip.sold{background:#B3261E;}
  .item-status-chip.reserved{background:var(--orange);}
  .item-del-btn{
    position:absolute;right:8px;top:8px;background:#fff;border:1px solid var(--line);
    color:#B3261E;width:26px;height:26px;border-radius:50%;font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .item-edit-btn{
    position:absolute;right:8px;bottom:8px;background:#fff;border:1.5px solid var(--green-mid);
    color:var(--green-mid);font-size:11px;font-weight:800;letter-spacing:0.03em;
    padding:5px 12px;border-radius:8px;cursor:pointer;
  }
  .item-edit-btn:hover{background:var(--green-soft);}
  .item-pdetails{padding:10px 12px 12px;}
  .item-offer-badge{
    display:inline-block;font-size:10px;font-weight:700;color:var(--green-mid);
    background:var(--green-soft);padding:2px 6px;border-radius:6px;margin-bottom:4px;
  }
  .item-price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:2px;}
  .item-pprice{font-size:15px;font-weight:800;color:var(--ink);}
  .item-pmrp{font-size:11px;color:var(--ink-soft);text-decoration:line-through;}
  .item-pcard h4{font-size:13px;font-weight:600;margin:0 0 2px;color:var(--ink);line-height:1.3;}
  .item-pcard .item-pdesc{font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}
  .item-invoice-btn{
    margin-top:9px;width:100%;padding:8px;border:1.5px solid var(--orange);
    background:#fff;color:var(--orange);font-weight:700;font-size:11.5px;
    border-radius:8px;cursor:pointer;transition:background .18s ease,color .18s ease;
  }
  .item-invoice-btn:hover{background:var(--orange);color:#fff;}
  .item-invoice-btn:disabled{
    border-color:var(--line);color:var(--ink-soft);background:var(--green-soft);
    cursor:not-allowed;opacity:0.85;
  }
  .item-invoice-btn:disabled:hover{background:var(--green-soft);color:var(--ink-soft);}

  /* ---------- Invoice modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(18,58,43,0.55);z-index:50;
    display:none;align-items:center;justify-content:center;padding:16px;
  }
  .modal-card{
    width:100%;max-width:460px;max-height:90vh;overflow-y:auto;
    background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  }
  .modal-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:#fff;z-index:1;
  }
  .modal-header h3{font-size:16px;margin:0;color:var(--green-deep);}
  .modal-close{border:none;background:none;font-size:16px;cursor:pointer;color:var(--ink-soft);}
  .modal-body{padding:18px;}
  .invoice-car-summary{
    font-size:13px;font-weight:700;color:var(--green-mid);background:var(--green-soft);
    padding:9px 12px;border-radius:10px;margin-bottom:14px;
  }
  .report-summary-row{
    display:flex;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .report-stat{flex:1;min-width:110px;}
  .report-stat .label{font-size:11px;color:var(--ink-soft);margin-bottom:2px;}
  .report-stat .value{font-size:20px;font-weight:800;color:var(--green-deep);font-family:'Fraunces',serif;}
  .report-row-price{font-weight:800;color:var(--green-deep);font-size:14px;white-space:nowrap;}
</style>
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="loginScreen">
  <div class="card">
    <div class="card-header">
      <div class="logo-badge">DT</div>
      <h1>Admin Login</h1>
      <p>Manage your DriveTrust showroom</p>
    </div>
    <div class="card-body">
      <form id="loginForm">
        <div class="field">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" required autocomplete="username">
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>
        <div class="form-msg" id="loginMsg"></div>
      </form>
      <div class="switch-link">New showroom? <a href="register.html">Register here</a></div>
    </div>
  </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div id="dashboard">
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo" id="topbarLogo" onclick="document.getElementById('topbarLogoInput').click()">
        <span id="topbarLogoInitials"></span>
        <img id="topbarLogoImg" style="display:none;">
        <span class="topbar-logo-edit">✎</span>
      </div>
      <input type="file" id="topbarLogoInput" accept="image/*" style="display:none;">
      <div>
        <h1 id="shopNameHeader">Showroom Admin</h1>
        <p id="shopMetaHeader"></p>
      </div>
    </div>
    <button id="logoutBtn">Log Out</button>
  </header>

  <main>
    <div class="tabs" id="dashTabs">
      <button class="tab-btn active" data-panel="cars">Cars</button>
      <button class="tab-btn" data-panel="report">Sales Report</button>
    </div>

    <!-- CARS PANEL -->
    <section class="panel active" id="panel-cars">
      <div class="add-form">
        <h3 id="itemFormTitle">Add New Car</h3>
        <form id="itemForm">
          <div class="row-3">
            <div class="field"><label>Brand</label><input type="text" id="carBrand" required placeholder="e.g. Maruti Suzuki"></div>
            <div class="field"><label>Model</label><input type="text" id="carModel" required placeholder="e.g. Swift VXI"></div>
            <div class="field"><label>Year</label><input type="number" id="carYear" required placeholder="e.g. 2019" min="1980" max="2026"></div>
          </div>
          <div class="row-3">
            <div class="field">
              <label>Body Type</label>
              <select id="carBodyType">
                <option value="Hatchback">Hatchback</option>
                <option value="Sedan">Sedan</option>
                <option value="SUV">SUV</option>
                <option value="MUV">MUV</option>
                <option value="Luxury">Luxury</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field">
              <label>Fuel Type</label>
              <select id="carFuelType">
                <option value="Petrol">Petrol</option>
                <option value="Diesel">Diesel</option>
                <option value="CNG">CNG</option>
                <option value="Electric">Electric</option>
                <option value="Hybrid">Hybrid</option>
              </select>
            </div>
            <div class="field">
              <label>Transmission</label>
              <select id="carTransmission">
                <option value="Manual">Manual</option>
                <option value="Automatic">Automatic</option>
              </select>
            </div>
          </div>
          <div class="row-3">
            <div class="field"><label>KM Driven</label><input type="number" id="carKmDriven" placeholder="e.g. 42000"></div>
            <div class="field">
              <label>Owners</label>
              <select id="carOwners">
                <option value="1">1st Owner</option>
                <option value="2">2nd Owner</option>
                <option value="3">3rd Owner</option>
                <option value="4">3+ Owners</option>
              </select>
            </div>
            <div class="field"><label>Color</label><input type="text" id="carColor" placeholder="e.g. Pearl White"></div>
          </div>
          <div class="row-3">
            <div class="field"><label>Asking Price (₹)</label><input type="number" id="carPrice" required placeholder="e.g. 550000"></div>
            <div class="field"><label>Original Price (₹) (optional)</label><input type="number" id="carOriginalPrice" placeholder="e.g. 720000"></div>
            <div class="field">
              <label>Status</label>
              <select id="carStatus">
                <option value="Available">Available</option>
                <option value="Reserved">Reserved</option>
                <option value="Sold">Sold</option>
              </select>
            </div>
          </div>
          <div class="row-3">
            <div class="field"><label>Registration No. (optional)</label><input type="text" id="carRegNumber" placeholder="e.g. TN 45 AB 1234"></div>
            <div class="field"><label>Insurance Valid Till (optional)</label><input type="date" id="carInsurance"></div>
          </div>
          <div class="field"><label>Description (optional)</label><input type="text" id="carDesc" placeholder="Short details — condition, features, service history"></div>
          <div class="field">
            <label>Car Image (optional)</label>
            <input type="file" id="carImage" accept="image/*">
            <img id="carImagePreview" style="display:none;margin-top:8px;width:100%;height:180px;object-fit:contain;object-position:center;background:#F7F5EE;border-radius:10px;border:1px solid var(--line);">
          </div>
          <button type="submit" class="btn btn-primary" id="itemSubmitBtn">Add Car</button>
          <button type="button" class="btn btn-secondary" id="itemCancelBtn" style="display:none;width:100%;margin-top:8px;">Cancel Edit</button>
        </form>
      </div>
      <div class="item-grid" id="itemsList"><div class="empty-state" style="grid-column:1/-1;">Loading cars…</div></div>
    </section>

    <!-- SALES REPORT PANEL -->
    <section class="panel" id="panel-report">
      <div class="add-form">
        <h3>Sales Report</h3>
        <div class="row-3">
          <div class="field"><label for="reportFromDate">From Date</label><input type="date" id="reportFromDate"></div>
          <div class="field"><label for="reportToDate">To Date</label><input type="date" id="reportToDate"></div>
          <div class="field" style="display:flex;align-items:flex-end;"><button type="button" class="btn btn-primary" id="reportLoadBtn" style="width:100%;">Generate Report</button></div>
        </div>
      </div>
      <div id="reportSummary"></div>
      <div id="reportList"><div class="empty-state">Pick a date range and generate the report.</div></div>
      <button type="button" class="btn btn-secondary" id="reportDownloadBtn" style="display:none;width:100%;margin-top:12px;">⬇ Download CSV</button>
    </section>
  </main>
</div>

<!-- ===================== CREATE INVOICE MODAL ===================== -->
<div id="invoiceModalOverlay" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Create Sale Invoice</h3>
      <button type="button" class="modal-close" onclick="closeInvoiceModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="invoice-car-summary" id="invoiceCarSummary"></div>
      <form id="invoiceForm">
        <div class="row-2">
          <div class="field"><label for="buyerName">Buyer Name</label><input type="text" id="buyerName" required placeholder="e.g. R. Karthik"></div>
          <div class="field"><label for="buyerPhone">Buyer Phone</label><input type="tel" id="buyerPhone" required placeholder="e.g. 9876543210"></div>
        </div>
        <div class="field"><label for="buyerAddress">Buyer Address</label><input type="text" id="buyerAddress" placeholder="e.g. 24, Gandhi Street, Coimbatore"></div>
        <div class="row-2">
          <div class="field"><label for="buyerId">ID Proof No. (optional)</label><input type="text" id="buyerId" placeholder="e.g. Aadhar / DL / PAN No."></div>
          <div class="field">
            <label for="paymentMode">Payment Mode</label>
            <select id="paymentMode">
              <option>Cash</option>
              <option>Bank Transfer</option>
              <option>UPI</option>
              <option>Finance / Loan</option>
              <option>Cheque</option>
            </select>
          </div>
        </div>
        <div class="row-2">
          <div class="field"><label for="salePrice">Sale Price (₹)</label><input type="number" id="salePrice" required></div>
          <div class="field"><label for="invoiceDate">Invoice Date</label><input type="date" id="invoiceDate" required></div>
        </div>
        <button type="submit" class="btn btn-primary" id="invoiceSubmitBtn">Generate Invoice</button>
      </form>
    </div>
  </div>
</div>

<script>
  // =========================================================
  // PASTE YOUR SUPABASE PROJECT DETAILS HERE (same as register.html)
  // =========================================================
  const SUPABASE_URL = "https://zxrlbenaxmjsfgexpkup.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_LsIi7VlsX2mRc6biHqgnZg_2aXDJOsL";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const SESSION_KEY = 'drivetrust_admin_showroom';

  function escapeHtml(str){
    return String(str ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  async function hashPassword(password){
    const enc = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // ---------- Login ----------
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('loginMsg');
    btn.disabled = true; btn.textContent = "Logging in...";
    msg.textContent = ""; msg.className = "form-msg";

    const username = document.getElementById('loginUsername').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;

    try{
      const { data, error } = await sb.from('showroom_profile').select('*').eq('username', username).limit(1);
      if (error) throw error;
      if (!data || data.length === 0) throw new Error("Incorrect username or password.");

      const showroom = data[0];
      const passwordHash = await hashPassword(password);
      if (showroom.password_hash !== passwordHash) throw new Error("Incorrect username or password.");

      sessionStorage.setItem(SESSION_KEY, JSON.stringify(showroom));
      enterDashboard(showroom);
    }catch(err){
      console.error(err);
      msg.textContent = "⚠️ Incorrect username or password.";
      msg.classList.add('err');
      btn.disabled = false; btn.textContent = "Log In";
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem(SESSION_KEY);
    window.location.reload();
  });

  // ---------- Session check on page load ----------
  function checkSession(){
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
      enterDashboard(JSON.parse(saved));
    }
  }

  let currentShop = null;

  function enterDashboard(showroom){
    currentShop = showroom;

    document.getElementById('shopNameHeader').textContent = currentShop.showroom_name;
    document.getElementById('shopMetaHeader').textContent = `${currentShop.district} · ${currentShop.phone}`;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    renderTopbarLogo();
    loadItems();
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('reportFromDate').value = today;
    document.getElementById('reportToDate').value = today;
    loadSalesReport();
  }

  function renderTopbarLogo(){
    const img = document.getElementById('topbarLogoImg');
    const initialsEl = document.getElementById('topbarLogoInitials');
    if (currentShop.showroomlogo){
      img.src = currentShop.showroomlogo;
      img.style.display = 'block';
      initialsEl.style.display = 'none';
    } else {
      const words = (currentShop.showroom_name || '').trim().split(/\s+/);
      const initials = words.length > 1
        ? (words[0][0] + words[1][0]).toUpperCase()
        : (currentShop.showroom_name || '?').slice(0, 2).toUpperCase();
      initialsEl.textContent = initials;
      initialsEl.style.display = 'block';
      img.style.display = 'none';
    }
  }

  document.getElementById('topbarLogoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    try{
      const path = `${currentShop.showroom_name.replace(/\s+/g,'-')}-${Date.now()}-${file.name}`;
      const { error: uploadError } = await sb.storage.from('showroom-logos').upload(path, file);
      if (uploadError) throw uploadError;

      let logoUrl = null;
      const { data: signedData, error: signError } = await sb.storage
        .from('showroom-logos')
        .createSignedUrl(path, 60 * 60 * 24 * 365 * 10); // valid 10 years
      if (!signError && signedData) {
        logoUrl = signedData.signedUrl;
      } else {
        const { data: publicData } = sb.storage.from('showroom-logos').getPublicUrl(path);
        logoUrl = publicData.publicUrl;
      }

      const { error: updateError } = await sb.from('showroom_profile').update({ showroomlogo: logoUrl }).eq('id', currentShop.id);
      if (updateError) throw updateError;

      currentShop.showroomlogo = logoUrl;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(currentShop));
      renderTopbarLogo();
    }catch(err){
      let readable = err.message || "Something went wrong.";
      if (readable.toLowerCase().includes('bucket not found')){
        readable = "Logo storage isn't set up yet. In Supabase, go to Storage → New bucket → name it exactly 'showroom-logos' (Public bucket ON), then try again.";
      }
      alert("Couldn't update logo: " + readable);
    }
  });

  // ---------- Tabs ----------
  document.getElementById('dashTabs').addEventListener('click', (e) => {
    if (!e.target.classList.contains('tab-btn')) return;
    document.querySelectorAll('#dashTabs .tab-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + e.target.dataset.panel).classList.add('active');
  });

  // ---------- CARS ----------
  let editingItemId = null;
  let allAdminItems = [];

  function formatKm(km){
    if (km === null || km === undefined || km === '') return '';
    return Number(km).toLocaleString('en-IN') + ' km';
  }
  function formatPrice(p){
    if (p === null || p === undefined || p === '') return '';
    return '₹' + Number(p).toLocaleString('en-IN');
  }

  async function loadItems(){
    const list = document.getElementById('itemsList');
    const { data, error } = await sb.from('cars').select('*').eq('showroom_name', currentShop.showroom_name).order('created_at', { ascending:false });
    if (error){ list.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Couldn't load cars.</div>`; return; }
    allAdminItems = data || [];
    if (!allAdminItems.length){ list.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No cars listed yet — add one above.</div>`; return; }
    list.innerHTML = allAdminItems.map(i => `
      <div class="item-pcard">
        <div class="item-pimg-wrap">
          ${i.carimage
            ? `<img class="item-pimg" src="${escapeHtml(i.carimage)}" alt="${escapeHtml(i.brand + ' ' + i.model)}" data-fallback="${escapeHtml((i.brand || '?').charAt(0).toUpperCase())}" onerror="onAdminImgError(this)">`
            : `<div class="item-pimg-placeholder">${escapeHtml((i.brand || '?').charAt(0).toUpperCase())}</div>`}
          <span class="item-status-chip ${escapeHtml((i.status || 'available').toLowerCase())}">${escapeHtml(i.status || 'Available')}</span>
          <span class="item-pchip">${i.kmdriven ? formatKm(i.kmdriven) : escapeHtml(i.bodytype || '')}</span>
          <button type="button" class="item-del-btn" onclick="deleteItem('${i.id}')">✕</button>
          <button type="button" class="item-edit-btn" onclick="editItem('${i.id}')">EDIT</button>
        </div>
        <div class="item-pdetails">
          <div class="item-offer-badge">${escapeHtml(i.year || '')} · ${escapeHtml(i.fueltype || '')} · ${escapeHtml(i.transmission || '')}</div>
          <div class="item-price-row">
            ${i.price ? `<span class="item-pprice">${formatPrice(i.price)}</span>` : ''}
            ${i.originalprice ? `<span class="item-pmrp">${formatPrice(i.originalprice)}</span>` : ''}
          </div>
          <h4>${escapeHtml(i.brand)} ${escapeHtml(i.model)}</h4>
          ${i.description ? `<div class="item-pdesc">${escapeHtml(i.description)}</div>` : ''}
          ${(i.status || '').toLowerCase() === 'sold'
            ? `<button type="button" class="item-invoice-btn" disabled>✓ Sold — Invoice Created</button>`
            : `<button type="button" class="item-invoice-btn" onclick="openInvoiceModal('${i.id}')">🧾 Create Invoice</button>`}
        </div>
      </div>
    `).join('');
  }

  function onAdminImgError(imgEl){
    const div = document.createElement('div');
    div.className = 'item-pimg-placeholder';
    div.textContent = imgEl.dataset.fallback || '?';
    imgEl.replaceWith(div);
  }

  // Populate the form with an existing car's data and switch to edit mode
  function editItem(id){
    const item = allAdminItems.find(i => i.id === id);
    if (!item) return;
    editingItemId = id;

    document.getElementById('carBrand').value = item.brand || '';
    document.getElementById('carModel').value = item.model || '';
    document.getElementById('carYear').value = item.year ?? '';
    document.getElementById('carBodyType').value = item.bodytype || 'Hatchback';
    document.getElementById('carFuelType').value = item.fueltype || 'Petrol';
    document.getElementById('carTransmission').value = item.transmission || 'Manual';
    document.getElementById('carKmDriven').value = item.kmdriven ?? '';
    document.getElementById('carOwners').value = item.owners ?? '1';
    document.getElementById('carColor').value = item.color || '';
    document.getElementById('carPrice').value = item.price ?? '';
    document.getElementById('carOriginalPrice').value = item.originalprice ?? '';
    document.getElementById('carStatus').value = item.status || 'Available';
    document.getElementById('carRegNumber').value = item.regnumber || '';
    document.getElementById('carInsurance').value = item.insurancevalid || '';
    document.getElementById('carDesc').value = item.description || '';
    document.getElementById('carImage').value = '';

    const preview = document.getElementById('carImagePreview');
    if (item.carimage){ preview.src = item.carimage; preview.style.display = 'block'; }
    else { preview.style.display = 'none'; }

    document.getElementById('itemFormTitle').textContent = 'Edit Car';
    document.getElementById('itemSubmitBtn').textContent = 'Update Car';
    document.getElementById('itemCancelBtn').style.display = 'block';
    document.querySelector('.add-form').scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function cancelItemEdit(){
    editingItemId = null;
    document.getElementById('itemForm').reset();
    document.getElementById('carImagePreview').style.display = 'none';
    document.getElementById('itemFormTitle').textContent = 'Add New Car';
    document.getElementById('itemSubmitBtn').textContent = 'Add Car';
    document.getElementById('itemCancelBtn').style.display = 'none';
  }
  document.getElementById('itemCancelBtn').addEventListener('click', cancelItemEdit);

  // Live preview when the admin picks a car image file
  document.getElementById('carImage').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById('carImagePreview');
    if (!file){ preview.style.display = 'none'; return; }
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  });

  document.getElementById('itemForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('itemSubmitBtn');
    const isEditing = !!editingItemId;
    btn.disabled = true;

    const brand = document.getElementById('carBrand').value.trim();
    const model = document.getElementById('carModel').value.trim();
    const yearVal = document.getElementById('carYear').value;
    const bodytype = document.getElementById('carBodyType').value;
    const fueltype = document.getElementById('carFuelType').value;
    const transmission = document.getElementById('carTransmission').value;
    const kmVal = document.getElementById('carKmDriven').value;
    const owners = document.getElementById('carOwners').value;
    const color = document.getElementById('carColor').value.trim();
    const priceVal = document.getElementById('carPrice').value;
    const originalPriceVal = document.getElementById('carOriginalPrice').value;
    const status = document.getElementById('carStatus').value;
    const regnumber = document.getElementById('carRegNumber').value.trim();
    const insurancevalid = document.getElementById('carInsurance').value || null;
    const description = document.getElementById('carDesc').value.trim();
    const file = document.getElementById('carImage').files[0];

    const payload = {
      brand, model, bodytype, fueltype, transmission, color, status,
      regnumber, insurancevalid, description,
      owners: owners ? Number(owners) : null,
      showroom_name: currentShop.showroom_name
    };
    payload.year = yearVal ? Number(yearVal) : null;
    payload.kmdriven = kmVal ? Number(kmVal) : null;
    payload.price = priceVal ? Number(priceVal) : null;
    payload.originalprice = originalPriceVal ? Number(originalPriceVal) : null;

    try{
      if (file){
        btn.textContent = "Uploading image...";
        const path = `${currentShop.showroom_name.replace(/\s+/g,'-')}/${Date.now()}-${file.name}`;
        const { error: uploadError } = await sb.storage.from('car-images').upload(path, file);
        if (uploadError) throw uploadError;

        // Signed URLs work even if the bucket's "Public" toggle wasn't set
        // correctly — they carry their own access token. Fall back to a
        // plain public URL only if signing itself isn't available.
        let imageUrl = null;
        const { data: signedData, error: signError } = await sb.storage
          .from('car-images')
          .createSignedUrl(path, 60 * 60 * 24 * 365 * 10); // valid 10 years
        if (!signError && signedData) {
          imageUrl = signedData.signedUrl;
        } else {
          const { data: publicData } = sb.storage.from('car-images').getPublicUrl(path);
          imageUrl = publicData.publicUrl;
        }
        payload.carimage = imageUrl;
      }
      // If editing and no new file was chosen, the existing carimage is
      // left untouched (payload simply won't include the field).

      btn.textContent = isEditing ? "Updating..." : "Adding...";

      if (isEditing){
        const { error } = await sb.from('cars').update(payload).eq('id', editingItemId);
        if (error) throw error;
      } else {
        const { error } = await sb.from('cars').insert([payload]);
        if (error) throw error;
      }

      cancelItemEdit();
      loadItems();
      btn.disabled = false;
    }catch(err){
      let readable = err.message || "Something went wrong.";
      if (readable.toLowerCase().includes('bucket not found')){
        readable = "Image storage isn't set up yet. In Supabase, go to Storage → New bucket → name it exactly 'car-images' (Public bucket ON), then try again.";
      }
      alert("Couldn't save car: " + readable);
      btn.disabled = false;
      btn.textContent = isEditing ? "Update Car" : "Add Car";
    }
  });

  async function deleteItem(id){
    if (!confirm("Delete this car listing?")) return;
    const { error } = await sb.from('cars').delete().eq('id', id);
    if (error){ alert("Couldn't delete: " + error.message); return; }
    if (editingItemId === id) cancelItemEdit();
    loadItems();
  }

  // ---------- INVOICE ----------
  let invoiceCarId = null;

  function openInvoiceModal(carId){
    const car = allAdminItems.find(i => i.id === carId);
    if (!car) return;
    invoiceCarId = carId;

    document.getElementById('invoiceCarSummary').textContent =
      `${car.brand} ${car.model} · ${car.year || ''} · ${car.regnumber ? car.regnumber : 'No reg. no.'}`;

    document.getElementById('invoiceForm').reset();
    document.getElementById('salePrice').value = car.price ?? '';
    document.getElementById('invoiceDate').value = new Date().toISOString().slice(0, 10);

    document.getElementById('invoiceModalOverlay').style.display = 'flex';
  }

  function closeInvoiceModal(){
    document.getElementById('invoiceModalOverlay').style.display = 'none';
    invoiceCarId = null;
  }

  document.getElementById('invoiceModalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'invoiceModalOverlay') closeInvoiceModal();
  });

  document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('invoiceSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Generating...';

    const car = allAdminItems.find(i => i.id === invoiceCarId);
    if (!car){ btn.disabled = false; btn.textContent = 'Generate Invoice'; return; }

    const buyerName = document.getElementById('buyerName').value.trim();
    const buyerPhone = document.getElementById('buyerPhone').value.trim();
    const buyerAddress = document.getElementById('buyerAddress').value.trim();
    const buyerId = document.getElementById('buyerId').value.trim();
    const paymentMode = document.getElementById('paymentMode').value;
    const salePrice = Number(document.getElementById('salePrice').value);
    const invoiceDate = document.getElementById('invoiceDate').value;
    const invoiceNumber = 'INV-' + Date.now().toString().slice(-8);

    const payload = {
      invoice_number: invoiceNumber,
      showroom_name: currentShop.showroom_name,
      car_id: car.id,
      car_summary: `${car.brand} ${car.model}`,
      buyer_name: buyerName,
      buyer_phone: buyerPhone,
      buyer_address: buyerAddress,
      buyer_id_proof: buyerId,
      payment_mode: paymentMode,
      sale_price: salePrice,
      invoice_date: invoiceDate
    };

    try{
      const { error } = await sb.from('invoices').insert([payload]);
      if (error) throw error;

      // Mark the car as Sold now that an invoice has been raised
      await sb.from('cars').update({ status: 'Sold' }).eq('id', car.id);

      printInvoice(car, payload);
      closeInvoiceModal();
      loadItems();
    }catch(err){
      let readable = err.message || "Something went wrong.";
      if (readable.toLowerCase().includes('row-level security') || readable.toLowerCase().includes('does not exist')){
        readable = "The 'invoices' table isn't set up yet. Run the SQL for it from supabase-setup.md, then try again.";
      }
      alert("Couldn't create invoice: " + readable);
    }finally{
      btn.disabled = false;
      btn.textContent = 'Generate Invoice';
    }
  });

  function printInvoice(car, inv){

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Invoice ${escapeHtml(inv.invoice_number)}</title>

<body>

  // ---------- SALES REPORT (from the invoices table) ----------
  let currentReportData = [];
  let currentReportFrom = '';
  let currentReportTo = '';

  function formatDisplayDate(d){
    if (!d) return '';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }

  async function loadSalesReport(){
    const fromDate = document.getElementById('reportFromDate').value;
    const toDate = document.getElementById('reportToDate').value;
    const summary = document.getElementById('reportSummary');
    const list = document.getElementById('reportList');
    const downloadBtn = document.getElementById('reportDownloadBtn');
    if (!fromDate || !toDate){ return; }

    if (fromDate > toDate){
      list.innerHTML = `<div class="empty-state">"From Date" must be on or before "To Date".</div>`;
      summary.innerHTML = '';
      downloadBtn.style.display = 'none';
      return;
    }

    list.innerHTML = `<div class="empty-state">Generating report…</div>`;
    summary.innerHTML = '';
    downloadBtn.style.display = 'none';

    // Pull every invoice for this showroom within the selected date range
    const { data, error } = await sb.from('invoices')
      .select('*')
      .eq('showroom_name', currentShop.showroom_name)
      .gte('invoice_date', fromDate)
      .lte('invoice_date', toDate)
      .order('invoice_date', { ascending:false })
      .order('created_at', { ascending:false });

    if (error){
      console.error('Sales report query failed:', error);
      let readable = error.message || "Couldn't load the report.";
      if (readable.toLowerCase().includes('does not exist') || readable.toLowerCase().includes('schema cache')){
        readable = "The 'invoices' table isn't set up yet (or is missing the invoice_date column). Run the SQL from supabase-setup.md, then try again.";
      } else if (readable.toLowerCase().includes('row-level security') || readable.toLowerCase().includes('policy')){
        readable = "Your Supabase project is missing the read permission for invoices. Run the 'Public can read invoices' policy SQL from supabase-setup.md.";
      }
      list.innerHTML = `<div class="empty-state">⚠️ ${escapeHtml(readable)}</div>`;
      return;
    }

    currentReportData = data || [];
    currentReportFrom = fromDate;
    currentReportTo = toDate;

    const rangeLabel = fromDate === toDate
      ? formatDisplayDate(fromDate)
      : `${formatDisplayDate(fromDate)} – ${formatDisplayDate(toDate)}`;

    if (!currentReportData.length){
      list.innerHTML = `<div class="empty-state">No sales recorded for ${rangeLabel}.</div>`;
      return;
    }

    const totalRevenue = currentReportData.reduce((sum, r) => sum + Number(r.sale_price || 0), 0);
    const avgSale = totalRevenue / currentReportData.length;

    summary.innerHTML = `
      <div class="report-summary-row">
        <div class="report-stat">
          <div class="label">Period</div>
          <div class="value" style="font-size:14px;">${rangeLabel}</div>
        </div>
        <div class="report-stat">
          <div class="label">Cars Sold</div>
          <div class="value">${currentReportData.length}</div>
        </div>
        <div class="report-stat">
          <div class="label">Total Revenue</div>
          <div class="value">₹${totalRevenue.toLocaleString('en-IN')}</div>
        </div>
        <div class="report-stat">
          <div class="label">Avg. Sale Price</div>
          <div class="value">₹${Math.round(avgSale).toLocaleString('en-IN')}</div>
        </div>
      </div>`;

    list.innerHTML = currentReportData.map(r => `
      <div class="list-item">
        <div class="info">
          <h4>${escapeHtml(r.car_summary || '')}</h4>
          <div class="meta"><span class="badge">${escapeHtml(r.payment_mode || '')}</span>${escapeHtml(r.buyer_name || '')} · ${escapeHtml(r.buyer_phone || '')}</div>
          <div class="desc">${escapeHtml(r.invoice_number || '')} · ${formatDisplayDate(r.invoice_date)}</div>
        </div>
        <div class="report-row-price">₹${Number(r.sale_price || 0).toLocaleString('en-IN')}</div>
      </div>
    `).join('');

    downloadBtn.style.display = 'block';
  }

  function downloadReportCsv(){
    if (!currentReportData.length) return;

    const headers = ['Invoice No', 'Date', 'Car', 'Buyer Name', 'Buyer Phone', 'Payment Mode', 'Sale Price (INR)'];
    const rows = currentReportData.map(r => [
      r.invoice_number, r.invoice_date, r.car_summary, r.buyer_name, r.buyer_phone, r.payment_mode, r.sale_price
    ]);
    const totalRevenue = currentReportData.reduce((sum, r) => sum + Number(r.sale_price || 0), 0);
    rows.push(['', '', '', '', '', 'TOTAL', totalRevenue]);

    const csvBody = [headers, ...rows]
      .map(row => row.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(','))
      .join('\r\n');

    const blob = new Blob([csvBody], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const rangeTag = currentReportFrom === currentReportTo ? currentReportFrom : `${currentReportFrom}_to_${currentReportTo}`;
    a.download = `${currentShop.showroom_name.replace(/\s+/g,'-')}-sales-report-${rangeTag}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('reportLoadBtn').addEventListener('click', loadSalesReport);
  document.getElementById('reportDownloadBtn').addEventListener('click', downloadReportCsv);

  checkSession();
</script>

</body>
</html>
